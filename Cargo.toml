[package]
name = "fleet"
version = "0.2.1"
authors = ["Daniel Corn <info@cundd.net>"]
edition = "2021"

[features]
# To activate YAML support
default = ["yaml"]
yaml = ["yaml_serde"]


[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yaml_serde = { version = "0.10", optional = true }
ssh2 = "0.9"
clap = { version = "4.5", features = ["derive", "unicode"] }
ansi_term = "0.12"
dirs = "7.0"
comfy-table = "8.0"
